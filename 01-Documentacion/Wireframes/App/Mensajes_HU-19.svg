<svg xmlns="http://www.w3.org/2000/svg" width="870" height="780" viewBox="0 0 870 780"><rect width="100%" height="100%" fill="#f3f6f8"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#273444" text-anchor="start">Mensajes y estados de la app  |  HU-19</text><text x="40" y="82" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#637184" text-anchor="start">Estos estados se aplican a todas las pantallas correspondientes.</text><rect x="38" y="125" width="375" height="266" rx="14" fill="#ffffff" stroke="#c7d0da" stroke-width="2"/><text x="60" y="165" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#273444" text-anchor="start">Sin conexión</text><line x1="60" y1="180" x2="388" y2="180" stroke="#c7d0da" stroke-width="2" /><text x="60" y="223" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#273444" text-anchor="start">No fue posible conectarse.</text><text x="60" y="256" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#637184" text-anchor="start">Verifique su conexión a internet.</text><rect x="58" y="302" width="332" height="52" rx="8" fill="#e7edf6" stroke="#273444" stroke-width="1.4"/><text x="224" y="334" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#273444" text-anchor="middle">REINTENTAR</text><rect x="453" y="125" width="375" height="266" rx="14" fill="#ffffff" stroke="#c7d0da" stroke-width="2"/><text x="475" y="165" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#273444" text-anchor="start">Sin resultados</text><line x1="475" y1="180" x2="803" y2="180" stroke="#c7d0da" stroke-width="2" /><text x="475" y="223" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#273444" text-anchor="start">No se encontraron productos.</text><text x="475" y="256" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#637184" text-anchor="start">Pruebe con otro término o filtro.</text><rect x="473" y="302" width="332" height="52" rx="8" fill="#e7edf6" stroke="#273444" stroke-width="1.4"/><text x="639" y="334" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#273444" text-anchor="middle">VOLVER A BUSCAR</text><rect x="38" y="430" width="375" height="266" rx="14" fill="#ffffff" stroke="#c7d0da" stroke-width="2"/><text x="60" y="470" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#273444" text-anchor="start">Acceso no autorizado</text><line x1="60" y1="485" x2="388" y2="485" stroke="#c7d0da" stroke-width="2" /><text x="60" y="528" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#273444" text-anchor="start">No tiene permiso para continuar.</text><text x="60" y="561" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#637184" text-anchor="start">Inicie sesión o consulte al administrador.</text><rect x="58" y="607" width="332" height="52" rx="8" fill="#e7edf6" stroke="#273444" stroke-width="1.4"/><text x="224" y="639" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#273444" text-anchor="middle">ACEPTAR</text><rect x="453" y="430" width="375" height="266" rx="14" fill="#ffffff" stroke="#c7d0da" stroke-width="2"/><text x="475" y="470" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#273444" text-anchor="start">Error de datos</text><line x1="475" y1="485" x2="803" y2="485" stroke="#c7d0da" stroke-width="2" /><text x="475" y="528" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#273444" text-anchor="start">No se pudo completar la solicitud.</text><text x="475" y="561" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#637184" text-anchor="start">Revise la información e intente otra vez.</text><rect x="473" y="607" width="332" height="52" rx="8" fill="#e7edf6" stroke="#273444" stroke-width="1.4"/><text x="639" y="639" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#273444" text-anchor="middle">ENTENDIDO</text><text x="40" y="754" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#637184" text-anchor="start">Los mensajes pueden presentarse con ion-alert / ion-toast y estados vacíos.</text></svg>